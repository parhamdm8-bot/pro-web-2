<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>caffee | کافه ری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Vazirmatn:wght@300;400;600&display=swap">
<style>
:root{--g:#1E3932;--g2:#2c5348;--gold:#C9971E;--bg:#f7f4ec;--card:#ffffff;--tx:#1b1b1b;--h:64px;--headerbg:#1E3932;
--brand:"Bahnschrift Condensed","Bahnschrift","Oswald","Arial Narrow",sans-serif;
--brand2:"Constantia","Georgia","Vazirmatn",serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"Vazirmatn",Tahoma,sans-serif;padding-top:calc(var(--h) + env(safe-area-inset-top,0px));min-height:100vh}
.brand{font-family:var(--brand);letter-spacing:.12em;text-transform:lowercase}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--g);display:grid;place-items:center;transition:opacity .4s}
#intro.out{opacity:0;pointer-events:none}
#intro .wrap{position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#intro h1,#intro .reflect{font-family:var(--brand2);font-weight:700;font-size:clamp(48px,14vw,120px);letter-spacing:.14em;direction:ltr;margin:0;
  background:linear-gradient(100deg,#8a6a1a 0%,#f0c948 20%,#fff8dc 40%,#f0c948 55%,#8a6a1a 75%,#f0c948 90%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#intro h1{opacity:0;transform:scale(.82);animation:introIn .35s cubic-bezier(.2,.8,.3,1) forwards,shine 1.1s linear .1s infinite}
#intro .reflect{position:absolute;top:100%;right:0;width:100%;transform:scaleY(-1);opacity:.16;filter:blur(1px);pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 70%);mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 70%);
  animation:shine 1.1s linear .1s infinite}
#intro.leave h1,#intro.leave .reflect{animation:introOut .45s ease forwards!important}
@keyframes introIn{to{opacity:1;transform:scale(1)}}
@keyframes introOut{to{opacity:0;transform:scale(1.08);filter:blur(6px)}}
@keyframes shine{0%{background-position:220% 0}100%{background-position:-60% 0}}
/* header */
header{position:fixed;top:0;inset-inline:0;z-index:50;height:calc(var(--h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(30,57,50,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold)}
header .name{font-size:clamp(24px,6vw,34px);color:var(--gold);text-align:center;font-family:var(--brand2);letter-spacing:.08em}
header a{color:var(--tx);text-decoration:none}
.about{justify-self:start;font-size:14px;color:var(--gold);border:1px solid var(--gold);padding:6px 12px;border-radius:20px;transition:.2s}
.about:hover{background:var(--gold);color:#1E3932}
.contact{justify-self:end;text-align:left;direction:ltr;font-size:12px;line-height:1.5;display:flex;flex-direction:column}
.contact b{font-weight:600;letter-spacing:.05em;color:#fff}
.contact span{color:var(--gold)}
/* menu nav */
nav{position:sticky;top:calc(var(--h) + env(safe-area-inset-top,0px));z-index:40;background:rgba(247,244,236,.95);display:flex;justify-content:center;gap:6px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #e2dccb}
nav button{font:inherit;font-size:15px;color:#666;background:none;border:1px solid transparent;padding:8px 18px;border-radius:24px;cursor:pointer;white-space:nowrap;transition:.25s}
nav button.on{background:var(--g);color:#fff;border-color:var(--gold)}
main{max-width:860px;margin:0 auto;padding:36px 18px 20px}
h2{font-weight:300;font-size:26px;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--g),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:1px solid #dfe6dc;border-radius:12px;padding:18px 16px;display:flex;align-items:center;gap:12px;transition:.25s}
.item:hover{border-color:var(--gold);box-shadow:0 0 0 3px rgba(30,57,50,.4),0 10px 22px rgba(0,0,0,.14);background:#eef3ec;transform:translateY(-2px)}
.item::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.item.has{flex-direction:column;align-items:stretch;padding:0;gap:0;overflow:hidden}
.item.has::before{display:none}
.item.has img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.item.has span{padding:12px 14px;text-align:center;font-size:15px}
.cat{display:none;animation:in .5s forwards}
.cat.on{display:block}
#about{max-width:860px;margin:50px auto 0;padding:34px 18px 60px;scroll-margin-top:calc(var(--h) + 20px + env(safe-area-inset-top,0px))}
.box{background:var(--card);border:1px solid var(--g);border-radius:14px;padding:8px 22px}
.row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #e6e2d4;flex-wrap:wrap}
.row:last-child{border:0}
.row span{color:var(--gold)}
.row div{direction:ltr;text-align:left}
.row .fa{direction:rtl}
.row div a{color:inherit;text-decoration:none}
.row div a:hover{text-decoration:underline}
.contact a{text-decoration:none;display:contents}
footer{text-align:center;padding:24px;color:#999;font-size:12px;font-family:var(--brand);letter-spacing:.2em}

.price{display:block;margin-top:6px;font-size:13px;color:var(--g);font-weight:600}
.item.has span{display:flex;flex-direction:column;gap:2px}
#adminFab{position:fixed;bottom:16px;left:16px;z-index:70;width:52px;height:52px;border-radius:50%;background:none;border:none;padding:0;cursor:pointer;opacity:0}
#adminFab img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.modalWrap{position:fixed;inset:0;z-index:90;background:rgba(10,14,12,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modalWrap.on{display:flex}
.modalBox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;position:relative}
.modalBox h3{color:var(--g);margin-bottom:16px;font-size:20px}
.modalClose{position:absolute;top:14px;left:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#888}
.mField{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.mField label{font-size:13px;color:#555}
.mField input{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font:inherit;direction:ltr;text-align:left}
.mBtn{width:100%;padding:12px;border-radius:24px;border:1px solid var(--g);background:var(--g);color:#fff;font:inherit;cursor:pointer;font-size:15px}
.mBtn.ghost{background:none;color:var(--g);margin-top:8px}
.mErr{color:#b23;font-size:13px;margin-top:-6px;margin-bottom:10px;display:none}
.adminTabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.adminTabs button{font:inherit;font-size:13px;padding:7px 14px;border-radius:16px;border:1px solid #ddd;background:#f4f4f4;cursor:pointer}
.adminTabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.adminRow{display:grid;grid-template-columns:52px 1fr 90px 30px;grid-template-areas:"thumb name price rm";gap:8px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee}
.adminRow .thumbWrap{grid-area:thumb;position:relative;display:block;width:48px;height:48px}
.adminRow .nameInput{grid-area:name}
.adminRow .priceInput{grid-area:price}
.adminRow .rm{grid-area:rm}
.adminRow .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eee;cursor:pointer;display:block;border:1px dashed #ccc}
.adminRow .rmImgBtn{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:#b23;color:#fff;border-radius:50%;font-size:12px;line-height:18px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.adminRow input[type=text],.adminRow input[type=number]{padding:7px 8px;border:1px solid #ddd;border-radius:6px;font:inherit;font-size:13px;width:100%}
.adminRow .rm{background:none;border:none;color:#b23;font-size:18px;cursor:pointer}
@media (max-width:480px){
  .adminRow{grid-template-columns:52px 1fr 26px;grid-template-areas:"thumb name rm" "thumb price rm";row-gap:6px}
}
.addItemBtn{width:100%;padding:9px;border-radius:8px;border:1px dashed var(--g);background:none;color:var(--g);font:inherit;cursor:pointer;margin-bottom:16px}
.saveBar{display:flex;gap:10px;margin-top:6px}
.saveBar .mBtn{width:auto;flex:1}
.savedMsg{color:var(--g);font-size:13px;text-align:center;margin-top:10px;display:none}
</style>
</head>

const BASE_DATA={
cold:["آیس آمریکانو","آیس موکا","آیس کاراملو","آیس چاکلت","آیس لاته"],
hot:["هات چاکلت","شیر عسل","اسپرسو","اسپرسو دبل","آمریکانو","آمریکانو دبل","لاته","قهوه ترک","ماسالا","کاپوچینو","نسکافه"],
cake:["ترامیسو","کروسان","کیک خیس","کیک شکلاتی","چیز کیک","کیک گردو","کیک هویج"],
shake:["شیک نسکافه","شیک نوتلا","شیک مخصوص","شیک شکلات","شیک میوه"]};
const titles={cold:"نوشیدنی سرد",hot:"نوشیدنی گرم",cake:"کیک",shake:"شیک"};

const ADMIN_USER="ParhamD.M56881412";
const ADMIN_PASS="ParhamD.M56881412091387";
const STORAGE_KEY="caffeeMenuData_v1";
let idc=1;
function newId(){return "it"+(idc++)+"_"+Date.now().toString(36);}

function buildDefaultData(){
  const out={};
  for(const k in BASE_DATA){
    out[k]=BASE_DATA[k].map(name=>({id:newId(),name,price:"",img:imgs[name]||null}));
  }
  return out;
}

function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      for(const k in titles){ if(!parsed[k]) parsed[k]=[]; }
      return parsed;
    }
  }catch(e){}
  return buildDefaultData();
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}

let data=loadData();

function fmtPrice(p){
  if(!p) return "";
  const n=String(p).replace(/[^0-9]/g,"");
  if(!n) return String(p);
  return Number(n).toLocaleString("fa-IR")+" تومان";
}

function renderMenu(){
  const m=document.getElementById("menu");
  const activeBtn=document.querySelector("nav button.on");
  const activeCat=activeBtn?activeBtn.dataset.c:"cold";
  m.innerHTML="";
  for(const k in titles){
    const items=data[k]||[];
    const cards=items.map(it=>{
      const price=it.price?`<span class="price">${fmtPrice(it.price)}</span>`:"";
      if(it.img){
        return `<div class="item has"><img src="${it.img}" alt="${it.name}" loading="lazy"><span>${it.name}${price}</span></div>`;
      }
      return `<div class="item"><span>${it.name}${price}</span></div>`;
    }).join("");
    m.insertAdjacentHTML("beforeend",`<section class="cat${k===activeCat?" on":""}" id="${k}"><h2>${titles[k]}</h2><div class="grid">${cards}</div></section>`);
  }
}
renderMenu();

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.cat").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.c).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
});

// intro
const intro=document.getElementById("intro");
setTimeout(()=>intro.classList.add("leave"),850);
setTimeout(()=>{intro.classList.add("out");setTimeout(()=>intro.remove(),400)},1000);

/* ---------- ADMIN PANEL ---------- */
function openModal(id){document.getElementById(id).classList.add("on");}
function closeModal(id){document.getElementById(id).classList.remove("on");}

document.getElementById("adminFab").onclick=()=>{
  if(sessionStorage.getItem("caffeeAdmin")==="1"){ openAdminPanel(); }
  else{ document.getElementById("lErr").style.display="none"; document.getElementById("lu").value=""; document.getElementById("lp").value=""; openModal("loginModal"); }
};

function tryLogin(){
  const u=document.getElementById("lu").value.trim();
  const p=document.getElementById("lp").value;
  if(u===ADMIN_USER && p===ADMIN_PASS){
    sessionStorage.setItem("caffeeAdmin","1");
    closeModal("loginModal");
    openAdminPanel();
  }else{
    document.getElementById("lErr").style.display="block";
  }
}
function logoutAdmin(){
  sessionStorage.removeItem("caffeeAdmin");
  closeModal("adminModal");
}

let adminCat="cold";
function openAdminPanel(){
  const tabs=document.getElementById("adminTabs");
  tabs.innerHTML=Object.keys(titles).map(k=>`<button data-c="${k}" class="${k===adminCat?"on":""}">${titles[k]}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{adminCat=b.dataset.c;renderAdminList();openAdminPanel();});
  renderAdminList();
  document.getElementById("savedMsg").style.display="none";
  openModal("adminModal");
}

function renderAdminList(){
  const wrap=document.getElementById("adminList");
  const items=data[adminCat]||[];
  wrap.innerHTML=items.map(it=>`
    <div class="adminRow" data-id="${it.id}">
      <label class="thumbWrap">
        <img class="thumb" src="${it.img||''}" alt="">
        ${it.img?'<span class="rmImgBtn" title="حذف عکس">&times;</span>':''}
        <input type="file" accept="image/*" style="display:none" class="fileInput">
      </label>
      <input type="text" class="nameInput" value="${it.name.replace(/"/g,'&quot;')}" placeholder="اسم محصول">
      <input type="text" class="priceInput" value="${it.price||''}" placeholder="قیمت">
      <button class="rm" title="حذف">&times;</button>
    </div>`).join("");

  wrap.querySelectorAll(".adminRow").forEach(row=>{
    const id=row.dataset.id;
    const thumb=row.querySelector(".thumb");
    const fileInput=row.querySelector(".fileInput");
    thumb.onclick=()=>fileInput.click();
    fileInput.onchange=()=>{
      const f=fileInput.files[0]; if(!f) return;
      const reader=new FileReader();
      reader.onload=()=>{
        thumb.src=reader.result;
        const it=data[adminCat].find(x=>x.id===id);
        if(it) it.img=reader.result;
        renderAdminList();
      };
      reader.readAsDataURL(f);
    };
    const rmImgBtn=row.querySelector(".rmImgBtn");
    if(rmImgBtn){
      rmImgBtn.onclick=(e)=>{
        e.preventDefault(); e.stopPropagation();
        const it=data[adminCat].find(x=>x.id===id);
        if(it) it.img=null;
        renderAdminList();
      };
    }
    row.querySelector(".rm").onclick=()=>{
      data[adminCat]=data[adminCat].filter(x=>x.id!==id);
      renderAdminList();
    };
  });
}

document.getElementById("addItemBtn").onclick=()=>{
  const name=prompt("اسم محصول جدید را وارد کنید:");
  if(!name||!name.trim()) return;
  data[adminCat].push({id:newId(),name:name.trim(),price:"",img:null});
  renderAdminList();
};

function syncAdminInputsToData(){
  document.querySelectorAll("#adminList .adminRow").forEach(row=>{
    const id=row.dataset.id;
    const it=data[adminCat].find(x=>x.id===id);
    if(!it) return;
    it.name=row.querySelector(".nameInput").value.trim()||it.name;
    it.price=row.querySelector(".priceInput").value.trim();
  });
}

function saveAdmin(){
  syncAdminInputsToData();
  saveData();
  renderMenu();
  const msg=document.getElementById("savedMsg");
  msg.style.display="block";
  setTimeout(()=>msg.style.display="none",2200);
}
</script>
